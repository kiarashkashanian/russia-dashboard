name: Refresh Russia data
on:
  schedule:
    - cron: "0 6 * * *"   # every day 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python refresh.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}  # optional, free from fred.stlouisfed.org
      - name: Commit refreshed data
        if: always()
        run: |
          git config user.name "refresh-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Data refresh $(date -u +%F\ %H:%M)" && git push)
